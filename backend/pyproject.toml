[project]
name = "support-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manas Singh", email = "manassingh910@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "firebase-admin>=7.5.0",
    "httpx>=0.28.1",
    "python-ulid>=4.0.1",
    "uvicorn[standard]>=0.52.4",
]


[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "firestore: needs the local Firestore emulator (see tests/conftest.py)",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
